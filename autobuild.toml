# Autobuild pipeline configuration for this repository. Declarative only —
# commands are plain shell strings and nothing here is evaluated. Each build
# reads this file from its own branch, so config changes flow through the
# pipeline itself. Full surface: docs/configuration.md.

# Root scalars, which TOML requires before the first table.
baseBranch = "main"
capacity = 5             # concurrent builds

# Named commands the kernel may run. `setup` runs after workspace provision and
# after a sandbox rehydrate; the rest are referenced by name from check steps.
[commands]
setup = "bun install"
lint = "bun run check"
typecheck = "bun run typecheck"
test = "bun run test"

# The configured universe and order of verification. A plan may deselect
# optional steps in its opening `verifySteps` front matter; a plan without that
# metadata runs all of them.
[verify]
steps = ["lint", "types", "unit", "dashboard"]

[verify.lint]
kind = "check"           # deterministic command + pass/fail, never an agent
command = "lint"         # ref into [commands]
always = true            # unconditional; a plan cannot deselect it

[verify.types]
kind = "check"
command = "typecheck"

[verify.unit]
kind = "check"
command = "test"

# Visual evidence for dashboard-touching builds. The kernel decides
# applicability from the build-owned diff; the skill never inspects Git or skips.
[verify.dashboard]
kind = "agent"
skill = "ab-verify-dashboard"
paths = ["packages/core/src/cli/dashboard/**", "packages/core/src/cli/dispatch.ts", "tools/dashboard-capture.ts", ".agents/skills/ab-verify-dashboard/SKILL.md"]

# Ordered post-verification steps, all failure-tolerant: a failure files an
# observation and never fails an otherwise green build.
[finalize]
steps = ["changelog"]

[finalize.changelog]
kind = "agent"
skill = "ab-finalize-changelog"

# Runtime, model, and args per phase role. `default` is the inheritance base
# and is never dispatched as a phase; every other role overrides each field
# independently, and a declared args list replaces rather than unions.
[roles.default]
runtime = "pi"
model = "openai-codex/gpt-5.6-sol"
# Failure-triggered fallbacks, tried in order within the same phase attempt:
# the other provider first, then Claude Opus via the Claude Code CLI as a last
# resort (it shares the maintainer's Claude subscription, so it is deliberately
# last).
alternates = [
  { model = "kimi-coding/k3" },
  { runtime = "claude", model = "claude-opus-5" },
]

[roles.implement]
runtime = "pi"
model = "openai-codex/gpt-5.6-sol"
alternates = [
  { model = "kimi-coding/k3" },
  { runtime = "claude", model = "claude-opus-5" },
]

[roles.plan-review]
runtime = "pi"
model = "kimi-coding/k3"
alternates = [
  { model = "openai-codex/gpt-5.6-sol" },
  { runtime = "claude", model = "claude-opus-5" },
]

[roles.code-review]
runtime = "pi"
model = "kimi-coding/k3"
alternates = [
  { model = "openai-codex/gpt-5.6-sol" },
  { runtime = "claude", model = "claude-opus-5" },
]

[policy]
stallRounds = 3          # a finding surviving N review rounds escalates
maxVerifyAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 6
harvestThreshold = 5     # queued observations that trigger a harvest on back-pressure

# Ticket source and lifecycle states. LINEAR_API_KEY is a secret: set it in the
# environment (a local .env works), never here.
[tickets]
source = "linear"
teamKey = "AUT"                 # Linear team key ("Auto-build")
readyState = "Todo"             # sole ready gate here; team AUT has no "Ready" state. Case-sensitive.
readyLabels = []                # additional label gate ([] = none)
claimedState = "In Progress"    # claim() moves the issue here
createState = "Todo"            # new tickets are filed here
triageState = "Backlog"         # bounced, aborted, and closed-unmerged tickets return here
proposalState = "Todo"          # harvest files proposals straight into the ready state: this
                                # repository runs its own harvest unattended and waives the
                                # grooming gate. Deliberately not triageState — a bounce landing
                                # in Todo would be reclaimed and bounced every tick.

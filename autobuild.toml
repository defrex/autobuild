# Autobuild pipeline configuration for this repository. Declarative only —
# commands are plain shell strings and nothing here is evaluated. Each build
# reads this file from its own branch, so config changes flow through the
# pipeline itself. Full surface: docs/configuration.md.

# Root scalars, which TOML requires before the first table.
baseBranch = "main"
capacity = 5             # concurrent builds

# Builds execute remotely while the dispatcher and hosted Store remain outside
# the guest. Only the model credential crosses this boundary.
[workspace]
provider = "vercel-sandbox"

[workspace.config]
image = "vercel/sandbox/universal:latest"
vcpus = 4
timeoutSeconds = 2700
operationTimeoutMs = 30000
environmentVariables = ["AI_GATEWAY_API_KEY"]
# The universal image is Ubuntu, where the apt `chromium` package is a snap
# stub that installs no browser; Google's own .deb provides a real binary.
provisioning = [
  { name = "system-install", command = """export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/google-chrome.deb
apt-get install -y -qq /tmp/google-chrome.deb fonts-noto-cjk fonts-noto-color-emoji fontconfig""" },
  { name = "browser-smoke", command = "CHROMIUM_BIN=/usr/bin/google-chrome-stable; \"$CHROMIUM_BIN\" --headless --no-sandbox --disable-gpu --dump-dom 'data:text/html,<title>Autobuild browser smoke</title>' >/dev/null" },
]

[workspace.config.runtimeProvisioning.pi]
install = "npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.84.4"
preflight = "test \"$(pi --version)\" = \"0.84.4\""

# Named commands the kernel may run. `setup` runs after workspace provision and
# after a sandbox rehydrate; the rest are referenced by name from check steps.
[commands]
setup = "bun install"
lint = "bun run check"
typecheck = "bun run typecheck"
test = "bun run test"

# The configured universe and order of verification. A plan may deselect
# optional steps in its opening `verifySteps` front matter; a plan without that
# metadata runs all of them.
[verify]
steps = ["lint", "types", "unit", "dashboard", "web-dashboard"]

[verify.lint]
kind = "check"           # deterministic command + pass/fail, never an agent
command = "lint"         # ref into [commands]
always = true            # unconditional; a plan cannot deselect it

[verify.types]
kind = "check"
command = "typecheck"

[verify.unit]
kind = "check"
command = "test"

# Visual evidence for dashboard-touching builds. The kernel decides
# applicability from the build-owned diff; the skill never inspects Git or skips.
[verify.dashboard]
kind = "agent"
skill = "ab-verify-dashboard"
paths = ["packages/core/src/cli/dashboard/**", "packages/core/src/cli/dispatch.ts", "tools/dashboard-capture.ts", ".agents/skills/ab-verify-dashboard/SKILL.md"]

# Visual evidence for the operator web app in app/. Same shape as the terminal
# step: the kernel decides applicability from the diff, the repository-local
# skill judges rendered frames against DESIGN.md and attaches them on a pass.
[verify.web-dashboard]
kind = "agent"
skill = "verify-web-dashboard"
paths = ["app/**", "tools/web-dashboard-capture.tsx", ".agents/skills/verify-web-dashboard/SKILL.md", "DESIGN.md"]

# Ordered post-verification steps, all failure-tolerant: a failure files an
# observation and never fails an otherwise green build.
[finalize]
steps = ["changelog"]

[finalize.changelog]
kind = "agent"
skill = "ab-finalize-changelog"

# Runtime, model, and args per phase role. `default` is the inheritance base
# and is never dispatched as a phase; every other role overrides each field
# independently, and a declared args list replaces rather than unions.
[roles.default]
runtime = "pi"
model = "vercel-ai-gateway/openai/gpt-5.6-sol"
# Failure-triggered fallbacks stay on Pi and preserve the repository's provider
# preference order. Disposable guests authenticate only through AI Gateway.
alternates = [
  { model = "vercel-ai-gateway/moonshotai/kimi-k3" },
  { model = "vercel-ai-gateway/anthropic/claude-opus-5" },
]

[roles.implement]
runtime = "pi"
model = "vercel-ai-gateway/openai/gpt-5.6-sol"
alternates = [
  { model = "vercel-ai-gateway/moonshotai/kimi-k3" },
  { model = "vercel-ai-gateway/anthropic/claude-opus-5" },
]

[roles.plan-review]
runtime = "pi"
model = "vercel-ai-gateway/moonshotai/kimi-k3"
alternates = [
  { model = "vercel-ai-gateway/openai/gpt-5.6-sol" },
  { model = "vercel-ai-gateway/anthropic/claude-opus-5" },
]

[roles.code-review]
runtime = "pi"
model = "vercel-ai-gateway/moonshotai/kimi-k3"
alternates = [
  { model = "vercel-ai-gateway/openai/gpt-5.6-sol" },
  { model = "vercel-ai-gateway/anthropic/claude-opus-5" },
]

[policy]
stallRounds = 3          # a finding surviving N review rounds escalates
maxVerifyAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 6
harvestThreshold = 5     # queued observations that trigger a harvest on back-pressure

# Ticket source and lifecycle states. Tickets are served by the hosted Autobuild
# service (AB_STORE / AB_TOKEN in the dispatcher's environment); the service
# holds LINEAR_API_KEY and forwards to the Linear team below. Nothing secret
# lives here.
[tickets]
source = "hosted"
teamKey = "AUT"                 # Linear team key ("Auto-build")
readyState = "Todo"             # sole ready gate here; team AUT has no "Ready" state. Case-sensitive.
readyLabels = []                # additional label gate ([] = none)
claimedState = "In Progress"    # claim() moves the issue here
createState = "Todo"            # new tickets are filed here
triageState = "Backlog"         # bounced, aborted, and closed-unmerged tickets return here
proposalState = "Todo"          # harvest files proposals straight into the ready state: this
                                # repository runs its own harvest unattended and waives the
                                # grooming gate. Deliberately not triageState — a bounce landing
                                # in Todo would be reclaimed and bounced every tick.

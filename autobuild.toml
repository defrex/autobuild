# Autobuild pipeline configuration for this repository. Declarative only —
# commands are plain shell strings and nothing here is evaluated. Each build
# reads this file from its own branch, so config changes flow through the
# pipeline itself. Full surface: docs/configuration.md.

# Root scalars, which TOML requires before the first table.
baseBranch = "main"
capacity = 5             # concurrent builds

# Builds run locally: each build gets a Git worktree under .autobuild/worktrees
# (the default `git-worktree` provider, so no [workspace] table) and its agents
# run on the maintainer's local Claude Code and Codex CLIs, which bill against
# their subscriptions rather than an API key.

# Named commands the kernel may run. `setup` runs after workspace provision and
# after a sandbox rehydrate; the rest are referenced by name from check steps.
[commands]
setup = "bun install"
lint = "bun run check"
typecheck = "bun run typecheck"
test = "bun run test"
test-postgres = "./scripts/postgres-live.sh ensure-running && AB_POSTGRES_TEST_URL='postgres://postgres:postgres@127.0.0.1:5432/postgres' bun test packages/postgres-store/src/store.live.test.ts packages/postgres-store/src/plan-invalidation.live.test.ts packages/postgres-store/src/migrate.test.ts packages/postgres-store/src/schema-guard.test.ts packages/postgres-store/src/tickets.live.test.ts packages/hosted-store-service/src/service.live.test.ts packages/hosted-store-service/src/web/mcp.live.test.ts"

# The configured universe and order of verification. A plan may deselect
# optional steps in its opening `verifySteps` front matter; a plan without that
# metadata runs all of them.
[verify]
steps = ["lint", "types", "unit", "postgres", "dashboard", "web-dashboard", "website"]

[verify.lint]
kind = "check"           # deterministic command + pass/fail, never an agent
command = "lint"         # ref into [commands]
always = true            # unconditional; a plan cannot deselect it

[verify.types]
kind = "check"
command = "typecheck"

[verify.unit]
kind = "check"
command = "test"

[verify.postgres]
kind = "check"
command = "test-postgres"
always = true

# Visual evidence for dashboard-touching builds. The kernel decides
# applicability from the build-owned diff; the skill never inspects Git or skips.
[verify.dashboard]
kind = "agent"
skill = "ab-verify-dashboard"
paths = ["packages/core/src/cli/dashboard/**", "packages/core/src/cli/dispatch.ts", "tools/dashboard-capture.ts", "tools/capture-parity.ts", ".agents/skills/ab-verify-dashboard/SKILL.md"]

# Visual evidence for the operator web app in the hosted store service
# package. Same shape as the terminal step: the kernel decides applicability
# from the diff, the repository-local skill judges rendered frames against
# DESIGN.md and attaches them on a pass. The operator read path and the shared
# dashboard projection feed these frames, so they gate it too; the skill also
# runs tools/capture-parity.ts to prove unchanged frames byte for byte.
[verify.web-dashboard]
kind = "agent"
skill = "verify-web-dashboard"
paths = ["packages/hosted-store-service/app/**", "packages/web-dashboard-capture/src/**", "packages/core/src/operator/**", "packages/core/src/cli/dashboard/**", "tools/capture-parity.ts", ".agents/skills/verify-web-dashboard/SKILL.md", "DESIGN.md"]

# The marketing site gets the same treatment: the repository-local skill
# renders it at desktop and phone widths, judges the frames against the
# reference screenshots in design/website/, and attaches them on a pass.
[verify.website]
kind = "agent"
skill = "verify-website"
paths = ["packages/website/**", "design/website/**"]

# Ordered post-verification steps, all failure-tolerant: a failure files an
# observation and never fails an otherwise green build.
[finalize]
steps = ["changelog"]

[finalize.changelog]
kind = "agent"
skill = "ab-finalize-changelog"

# Runtime, model, and args per phase role. `default` is the inheritance base
# and is never dispatched as a phase; every other role overrides each field
# independently, and a declared args list replaces rather than unions.
# Producers run on Claude Sonnet and reviewers on GPT, so a reviewer never
# shares the implementer's blind spots. Each role falls back to the other
# provider's model when its own is overloaded or out of quota.
[roles.default]
runtime = "claude"
model = "claude-sonnet-5-5"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol" }]

[roles.plan]
runtime = "claude"
model = "claude-sonnet-5-5"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol" }]

[roles.implement]
runtime = "claude"
model = "claude-sonnet-5-5"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol" }]

[roles.plan-review]
runtime = "codex"
model = "gpt-6.1-sol"
alternates = [{ runtime = "claude", model = "claude-sonnet-5-5" }]

[roles.code-review]
runtime = "codex"
model = "gpt-6.1-sol"
alternates = [{ runtime = "claude", model = "claude-sonnet-5-5" }]

[policy]
stallRounds = 3          # a finding surviving N review rounds escalates
# Large implement turns outrun the default 3600 s budget; one expired mid-turn
# on a large ticket (2026-09-10) and discarded the work.
sessionBudgetSeconds = 10800
maxVerifyAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 6
harvestThreshold = 5     # queued observations that trigger a harvest on back-pressure

# Ticket source and lifecycle states. The dispatcher talks to Linear directly
# with LINEAR_API_KEY from its environment (.env); nothing secret lives here.
[tickets]
source = "linear"
teamKey = "AUT"                 # Linear team key ("Auto-build")
readyState = "Todo"             # sole ready gate here; team AUT has no "Ready" state. Case-sensitive.
readyLabels = []                # additional label gate ([] = none)
claimedState = "In Progress"    # claim() moves the issue here
createState = "Todo"            # new tickets are filed here
triageState = "Backlog"         # bounced, aborted, and closed-unmerged tickets return here
proposalState = "Backlog"       # harvest proposals wait for a human to groom them to Todo.
                                # Auto-dispatching them (proposalState = readyState) ran away:
                                # each proposal build's observations filed more proposals.

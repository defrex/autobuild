# Autobuild pipeline configuration for this repository. Declarative only —
# commands are plain shell strings and nothing here is evaluated. Each build
# reads this file from its own branch, so config changes flow through the
# pipeline itself. Full surface: docs/configuration.md.

# Root scalars, which TOML requires before the first table.
baseBranch = "main"
capacity = 5             # concurrent builds

# Builds run remotely, dogfooding the hosted service since 2026-10-27. The
# kernel is the hosted dispatcher (Vercel Cron on the same Vercel project as
# app.autobuild.run). Each build executes in a disposable Vercel Sandbox, where
# Claude Code and Codex bill against the maintainer's personal subscriptions
# through the [accounts] below. The guest holds only placeholders; the host
# egress policy injects the real credentials from write-only project secrets.
[workspace]
provider = "vercel-sandbox"

[workspace.config]
image = "vercel/sandbox/universal:latest"
vcpus = 4
# One execution spans every phase up to a park point, and a single agent turn may
# use the full policy session budget, so the guest lifetime must cover several
# turns. At 2700 s implement sessions were cut off mid-turn (2026-09-10).
timeoutSeconds = 14400
operationTimeoutMs = 30000
# The universal image is Ubuntu, where the apt `chromium` package is a snap
# stub that installs no browser; Google's own .deb provides a real binary.
provisioning = [
  { name = "system-install", command = """export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/google-chrome.deb
apt-get install -y -qq /tmp/google-chrome.deb fonts-noto-cjk fonts-noto-color-emoji fontconfig""" },
  { name = "browser-smoke", command = "CHROMIUM_BIN=/usr/bin/google-chrome-stable BUN_BIN=/opt/autobuild-runtime/node_modules/.bin/bun ./scripts/browser-smoke.sh" },
  { name = "postgres", command = "./scripts/postgres-live.sh install" },
  # Finalize steps (and any in-guest git usage) need an attributable identity.
  # System scope applies to every user, including unprivileged agent sessions,
  # and survives a workspace re-clone (which wipes .git/config).
  { name = "git-identity", command = "git config --system user.name 'autobuild[bot]' && git config --system user.email 'autobuild[bot]@users.noreply.github.com'" },
]

# Every primary and alternate runtime needs a pinned install and an exact
# version preflight. Keep these on the versions the maintainer runs locally.
[workspace.config.runtimeProvisioning.claude]
install = "npm install --global @anthropic-ai/claude-code@2.1.311"
preflight = "test \"$(claude --version)\" = \"2.1.311 (Claude Code)\""

[workspace.config.runtimeProvisioning.codex]
install = "npm install --global @openai/codex@0.164.0"
preflight = "test \"$(codex --version)\" = \"codex-cli 0.164.0\""

# Personal subscriptions. Values are write-only project secrets on
# app.autobuild.run: CLAUDE_CODE_OAUTH_TOKEN via `ab secrets set` (from
# `claude setup-token`), and the ChatGPT slot via
# `ab accounts login chatgpt --project`, which the hosted secret refreshes.
[accounts.claude]
kind = "claude-subscription"
credentialEnv = "CLAUDE_CODE_OAUTH_TOKEN"

[accounts.chatgpt]
kind = "chatgpt-subscription"
credentialEnv = "CHATGPT_ACCESS_TOKEN"

# Named commands the kernel may run. `setup` runs after workspace provision and
# after a sandbox rehydrate; the rest are referenced by name from check steps.
[commands]
setup = "bun install"
lint = "bun run check"
typecheck = "bun run typecheck"
test = "bun run test"
build = "bun run check:build"
# Integration tests need a real PostgreSQL; the sandbox's `postgres`
# provisioning step installs it, and a local run uses the host's own.
test-integration = "./scripts/postgres-live.sh ensure-running && AB_POSTGRES_TEST_URL='postgres://postgres:postgres@127.0.0.1:5432/postgres' bun run test:integration"

# The configured universe and stage order of verification. Members of a stage
# run concurrently; every member must pass or skip before the next stage starts.
# A plan may deselect optional steps in its opening `verifySteps` front matter;
# a plan without that metadata runs all of them.
[verify]
# Cheap gates precede independent suites: unit needs no database, build probes
# use isolated temporary directories, and integration alone uses PostgreSQL on
# 5432 (its deploy rehearsal uses a unique schema, temporary consumer and
# ephemeral ports).
# All deterministic checks precede agents. Keep ui-tui separate from ui-app:
# both write .ab/dashboard-frames, including ui-app's capture-parity recapture.
# ui-app's .ab/web-dashboard-frames, ui-website's .ab/website-frames and docs'
# .ab/docs-verify-report.md are distinct. Browser profiles and website HTTP
# ports are allocated per invocation.
# Leave failFast unset: RFC 0004 §8 favors collecting independent sibling
# reports here; cheap gates already run before the long suites.
steps = [
  ["lint", "types"],
  ["unit", "build", "integration"],
  "ui-tui",
  ["ui-app", "ui-website", "docs"],
]

[verify.lint]
kind = "check"           # deterministic command + pass/fail, never an agent
command = "lint"         # ref into [commands]
always = true            # unconditional; a plan cannot deselect it

[verify.types]
kind = "check"
command = "typecheck"

[verify.unit]
kind = "check"
command = "test"

# Unit tests never need a database. Packaging is its own gate: every
# publishable package must pack, resolve its imports, and keep its bins.
[verify.build]
kind = "check"
command = "build"
always = true

# Integration tests need a database: the *.integration.test.ts suites plus a
# packed hosted-service deploy rehearsal. The hosted packages build on most of
# core, so core changes run it too; docs, skills and site-only builds skip it.
[verify.integration]
kind = "check"
command = "test-integration"
paths = ["packages/core/src/**", "packages/postgres-store/**", "packages/hosted-store-service/**", "packages/hosted-dispatcher/**", "templates/hosted-service/**", "tools/hosted-service-packaging.ts", "scripts/postgres-live.sh", "package.json", "bun.lock"]

# Visual evidence for dashboard-touching builds. The kernel decides
# applicability from the build-owned diff; the skill never inspects Git or skips.
[verify.ui-tui]
kind = "agent"
skill = "verify-ui-tui"
paths = ["packages/core/src/cli/dashboard/**", "packages/core/src/cli/dispatch.ts", "tools/dashboard-capture.ts", "tools/capture-parity.ts", ".agents/skills/verify-ui-tui/SKILL.md"]

# Visual evidence for the operator web app in the hosted store service
# package. Same shape as the terminal step: the kernel decides applicability
# from the diff, the repository-local skill judges rendered frames against
# DESIGN.md and attaches them on a pass. The operator read path and the shared
# dashboard projection feed these frames, so they gate it too; the skill also
# runs tools/capture-parity.ts to prove unchanged frames byte for byte.
[verify.ui-app]
kind = "agent"
skill = "verify-ui-app"
paths = ["packages/hosted-store-service/app/**", "packages/web-dashboard-capture/src/**", "packages/core/src/operator/**", "packages/core/src/cli/dashboard/**", "tools/capture-parity.ts", ".agents/skills/verify-ui-app/SKILL.md", "DESIGN.md"]

# The marketing site gets the same treatment: the repository-local skill
# renders it at desktop and phone widths, judges the frames against the
# reference screenshots in design/website/, and attaches them on a pass.
[verify.ui-website]
kind = "agent"
skill = "verify-ui-website"
paths = ["packages/website/**", "docs/**", "design/website/**", "tools/website-capture*", ".agents/skills/verify-ui-website/SKILL.md"]

# Semantic documentation coverage for this repository's product surfaces.
[verify.docs]
kind = "agent"
skill = "verify-docs"
paths = ["packages/core/src/**", "packages/hosted-dispatcher/src/**", "packages/hosted-store-service/src/**", "packages/hosted-store-service/app/**", "packages/postgres-store/src/**", "packages/vercel-sandbox/src/**", "packages/website/**", "bin/**", "skills/**", "templates/**", "SPEC.md", "README.md", "docs/**"]

# Ordered post-verification steps, all failure-tolerant: a failure files an
# observation and never fails an otherwise green build.
[finalize]
steps = ["changelog"]

[finalize.changelog]
kind = "agent"
skill = "finalize-changelog"

# Runtime, model, and args per phase role. `default` is the inheritance base
# and is never dispatched as a phase; every other role overrides each field
# independently, and a declared args list replaces rather than unions.
# Producers run on GPT and reviewers on Claude Opus, so a reviewer never
# shares the implementer's blind spots. Each role falls back to the other
# provider's model when its own is overloaded or out of quota. Every route
# names its billing account explicitly: Codex on the ChatGPT subscription,
# Claude Code on the Claude subscription.
[roles.default]
runtime = "codex"
model = "gpt-6.1-sol"
account = "chatgpt"
alternates = [{ runtime = "claude", model = "claude-opus-5-5", account = "claude" }]

[roles.plan]
runtime = "codex"
model = "gpt-6.1-sol"
account = "chatgpt"
alternates = [{ runtime = "claude", model = "claude-opus-5-5", account = "claude" }]

[roles.implement]
runtime = "codex"
model = "gpt-6.1-sol"
account = "chatgpt"
alternates = [{ runtime = "claude", model = "claude-opus-5-5", account = "claude" }]

[roles.plan-review]
runtime = "claude"
model = "claude-opus-5-5"
account = "claude"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol", account = "chatgpt" }]

[roles.code-review]
runtime = "claude"
model = "claude-opus-5-5"
account = "claude"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol", account = "chatgpt" }]

[policy]
stallRounds = 3          # a finding surviving N review rounds escalates
# Large implement turns outrun the default 3600 s budget; one expired mid-turn
# on a large ticket (2026-09-10) and discarded the work.
sessionBudgetSeconds = 10800
maxVerifyAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 6
harvestThreshold = 5     # queued observations that trigger a harvest on back-pressure

# Ticket source and lifecycle states. Tickets live in the hosted service at
# app.autobuild.run, so this repository dogfoods it (since 2026-10-27). Before
# that they were local files: this repository moved off Linear on 2026-10-21
# because the dispatcher kept exhausting Linear's hourly request budget. AUT-n
# ids were kept through both moves.
[tickets]
source = "hosted"
url = "https://app.autobuild.run"
teamKey = "AUT"
readyState = "ready"            # sole ready gate
readyLabels = []                # additional label gate ([] = none)
createState = "ready"           # new tickets are filed straight to ready, as before the move
triageState = "triage"          # bounced, aborted, and closed-unmerged tickets return here
proposalState = "triage"        # harvest proposals wait for a human to groom them to ready.
                                # Auto-dispatching them (proposalState = readyState) ran away:
                                # each proposal build's observations filed more proposals.

[store]
url = "https://app.autobuild.run"

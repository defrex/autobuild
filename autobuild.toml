# Autobuild pipeline configuration for this repository. Declarative only —
# commands are plain shell strings and nothing here is evaluated. Each build
# reads this file from its own branch, so config changes flow through the
# pipeline itself. Full surface: docs/configuration.md.

# Root scalars, which TOML requires before the first table.
baseBranch = "main"
capacity = 5             # concurrent builds

# Builds run locally: the maintainer's dispatcher runs from this checkout, each
# build gets a git worktree (the default workspace), and Claude Code and Codex
# use the host's own logins. No hosted service is needed, so a contributor can
# run the same pipeline with their own dispatcher (see [tickets] below). This
# repository dogfooded the hosted service and Vercel Sandbox guests from
# 2026-10-27 to 2026-11-23; that support remains in the product.

# Named commands the kernel may run. `setup` runs after workspace provision;
# the rest are referenced by name from check steps.
[commands]
setup = "bun install"
lint = "./scripts/verify-bun.sh bun run check"
typecheck = "./scripts/verify-bun.sh bun run typecheck"
test = "./scripts/verify-bun.sh bun run test"
build = "./scripts/verify-bun.sh bun run check:build"
app-load = "./scripts/verify-bun.sh bun run check:app-load"
# Integration tests need a real PostgreSQL; a local run uses the host's own on
# 5432 (postgres/postgres).
test-integration = "./scripts/postgres-live.sh ensure-running && AB_POSTGRES_TEST_URL='postgres://postgres:postgres@127.0.0.1:5432/postgres' ./scripts/verify-bun.sh bun run test:integration"

# The configured universe and stage order of verification. Members of a stage
# run concurrently; every member must pass or skip before the next stage starts.
# A plan may deselect optional steps in its opening `verifySteps` front matter;
# a plan without that metadata runs all of them.
[verify]
# Cheap gates precede independent suites. Unit is the in-memory suite: a guard
# fails any unit test that does IO, so it takes seconds. Integration holds every
# IO test (filesystem, processes, sockets, real time) plus the PostgreSQL suites
# on 5432 (its deploy rehearsal uses a unique schema, temporary consumer and
# ephemeral ports), and build probes use isolated temporary directories, so all
# three run concurrently. They were serialized on 2026-10-28 because unit and
# integration, both heavy, overran 5 s test defaults on the 4-vCPU sandbox;
# with unit reduced to seconds of CPU, integration plus build carries the same
# load the old unit plus build stage did.
# Nothing in this stage may write inside the checkout while build packs it:
# build's `bun pm pack --dry-run` opens every directory under the root package,
# gitignored .ab/ included, and an app-load Chromium profile there failed it
# with ENOENT (#1043). app-load keeps its bundles, pages and per-page profiles
# in a per-invocation OS temporary directory, removed when it finishes, and
# refuses a TMPDIR inside the worktree, so it joins the independent suites.
# All deterministic checks precede agents. Keep ui-tui separate from ui-app:
# both write .ab/dashboard-frames, including ui-app's capture-parity recapture.
# ui-app's .ab/web-dashboard-frames, ui-website's .ab/website-frames, ui-web's
# .ab/ui-web-frames and docs' .ab/docs-verify-report.md are distinct. Browser
# profiles and website HTTP ports are allocated per invocation; ui-web keeps
# its browser profiles in a per-invocation OS temporary directory.
# Leave failFast unset: RFC 0004 §8 favors collecting independent sibling
# reports here; cheap gates already run before the long suites.
steps = [
  ["lint", "types"],
  ["unit", "build", "integration", "app-load"],
  "ui-tui",
  ["ui-app", "ui-website", "ui-web", "docs"],
]

[verify.lint]
kind = "check"           # deterministic command + pass/fail, never an agent
command = "lint"         # ref into [commands]
always = true            # unconditional; a plan cannot deselect it

[verify.types]
kind = "check"
command = "typecheck"

[verify.unit]
kind = "check"
command = "test"

# Unit tests do no IO. Packaging is its own gate: every
# publishable package must pack, resolve its imports, and keep its bins.
[verify.build]
kind = "check"
command = "build"
always = true

# Integration runs every IO test: the *.integration.test.ts files across
# packages/, tools/, scripts/ and bin/, the PostgreSQL suites, and (with the
# database) a packed hosted-service deploy rehearsal. Like unit before it, it
# applies to every build: many of these tests check skills, docs and
# configuration, so path gating would silently stop them for those builds.
[verify.integration]
kind = "check"
command = "test-integration"

# Every operator web app page's real client code, bundled for the browser and
# mounted in headless Chromium over fixture data; an uncaught exception or
# unhandled rejection while a page loads fails, naming the page and the error.
# #951 changed only kernel files, yet pulled Bun-only code into the dashboard's
# client bundle and took the app down while every step passed. So the paths
# cover every file that bundle reads, core included, not just the app tree;
# docs-, skills- and website-only diffs still skip it. The bundle-input
# integration test fails when the bundle reads a file these paths miss.
[verify.app-load]
kind = "check"
command = "app-load"
paths = ["packages/hosted-store-service/app/**", "packages/hosted-store-service/src/**", "packages/hosted-store-service/package.json", "packages/hosted-store-service/tsconfig.json", "packages/core/src/**", "packages/core/package.json", "packages/web-dashboard-capture/**", "package.json", "bun.lock", "tsconfig.json"]

# Visual evidence for dashboard-touching builds. The kernel decides
# applicability from the build-owned diff; the skill never inspects Git or skips.
# Every overlay helper the capture entry point imports changes the frames, so
# each is listed; the ui-tui coverage test in
# tools/local-consumer-config.integration.test.ts fails when one is missing. A
# tools/*-capture.ts glob would also match the website capture, so it is not used.
[verify.ui-tui]
kind = "agent"
skill = "verify-ui-tui"
paths = [
  "packages/core/src/cli/dashboard/**",
  "packages/core/src/cli/dispatch.ts",
  "tools/dashboard-capture.ts",
  "tools/capture-parity.ts",
  ".agents/skills/verify-ui-tui/SKILL.md",
  "tools/account-credentials-capture.ts",
  "tools/verify-stages-capture.ts",
  "tools/rollback-capture.ts",
  "tools/handoff-capture.ts",
  "tools/parked-slot-wait-capture.ts",
  "tools/optimization-node-capture.ts",
  "tools/ticket-wait-capture.ts",
  "tools/harvest-suspension-capture.ts",
  "tools/native-session-capture.ts",
  "tools/judge-session-capture.ts",
  "tools/status-vocabulary-capture.ts",
]

# Visual evidence for the operator web app in the hosted store service
# package. Same shape as the terminal step: the kernel decides applicability
# from the diff, the repository-local skill judges rendered frames against
# DESIGN.md and attaches them on a pass. The operator read path and the shared
# dashboard projection feed these frames, so they gate it too; the skill also
# runs tools/capture-parity.ts to prove unchanged frames byte for byte.
[verify.ui-app]
kind = "agent"
skill = "verify-ui-app"
paths = ["packages/hosted-store-service/app/**", "packages/web-dashboard-capture/src/**", "packages/core/src/operator/**", "packages/core/src/cli/dashboard/**", "tools/capture-parity.ts", ".agents/skills/verify-ui-app/SKILL.md", "DESIGN.md"]

# The marketing site gets the same treatment: the repository-local skill
# renders it at desktop and phone widths, judges the frames against the
# reference screenshots in design/website/, and attaches them on a pass.
[verify.ui-website]
kind = "agent"
skill = "verify-ui-website"
paths = ["packages/website/**", "docs/**", "design/website/**", "tools/website-capture*", ".agents/skills/verify-ui-website/SKILL.md"]

# Visual and layout-shift evidence for the Autobuild ANSI design system and
# the `ab web` UI: the catalog and every web page over the scripted fixtures,
# both grounds at desktop and phone widths. The capture fails a page whose
# cumulative layout shift exceeds 0.002, the catalog's measured start-up
# baseline; the skill judges the frames against DESIGN.md and attaches them on
# a pass. Only the two UI trees select it: a change to the capture script or
# skill alone skips it (run `bun run capture:ui-web` by hand).
[verify.ui-web]
kind = "agent"
skill = "verify-ui-web"
paths = ["packages/ui/**", "packages/core/src/web/**"]

# Semantic documentation coverage for this repository's product surfaces.
[verify.docs]
kind = "agent"
skill = "verify-docs"
paths = ["packages/core/src/**", "packages/hosted-dispatcher/src/**", "packages/hosted-store-service/src/**", "packages/hosted-store-service/app/**", "packages/postgres-store/src/**", "packages/vercel-sandbox/src/**", "packages/website/**", "bin/**", "skills/**", "templates/**", "SPEC.md", "README.md", "docs/**"]

# Ordered post-verification steps, all failure-tolerant: a failure files an
# observation and never fails an otherwise green build.
[finalize]
steps = ["changelog"]

[finalize.changelog]
kind = "agent"
skill = "finalize-changelog"

# Runtime, model, and args per phase role. `default` is the inheritance base
# and is never dispatched as a phase; every other role overrides each field
# independently, and a declared args list replaces rather than unions.
# Producers run on Claude Opus because Claude is the larger subscription pool;
# reviewers run on GPT for model diversity. Each role falls back to the other
# provider's model when its own is overloaded or out of quota. Both runtimes
# use the dispatcher host's own CLI logins, so each contributor's dispatcher
# bills their own subscriptions.
[roles.default]
runtime = "codex"
model = "gpt-6.1-sol"
alternates = [{ runtime = "claude", model = "claude-opus-5-5" }]

[roles.plan]
runtime = "claude"
model = "claude-opus-5-5"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol" }]

[roles.implement]
runtime = "claude"
model = "claude-opus-5-5"
alternates = [{ runtime = "codex", model = "gpt-6.1-sol" }]

[roles.plan-review]
runtime = "codex"
model = "gpt-6.1-sol"
alternates = [{ runtime = "claude", model = "claude-opus-5-5" }]

[roles.code-review]
runtime = "codex"
model = "gpt-6.1-sol"
alternates = [{ runtime = "claude", model = "claude-opus-5-5" }]

[policy]
stallRounds = 3          # a finding surviving N review rounds escalates
# Large implement turns outrun the default 3600 s budget; one expired mid-turn
# on a large ticket (2026-09-10) and discarded the work.
sessionBudgetSeconds = 10800
maxVerifyAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 6
harvestThreshold = 5     # queued observations that trigger a harvest on back-pressure

# Merge policy. Releases are cut explicitly from main, so landing on main does
# not ship to production; integration nodes merge automatically once complete
# and verified, like leaves. `ab hold <slug>` still stops any one merge.
# (Without a rule, nodes default to consent.)
[[merge]]
from = "node"
mode = "auto"

# Ticket source and lifecycle states. Tickets are this repository's own GitHub
# issues (since 2026-11-23), so the backlog is as open as the code. States are
# `autobuild:<state>` labels; an open issue without one is in triage, so issues
# filed on GitHub arrive there, and only people with triage access can label
# one ready. Done closes the issue as completed, rejected as not planned.
# Earlier homes: Linear until 2026-10-21 (the dispatcher kept exhausting its
# hourly request budget), local files, then the hosted service from 2026-10-27.
# Hosted-era tickets were archived rather than imported, apart from a curated
# handful; AUT-n ids appear in older PRs and commits.
#
# Every dispatcher builds only issues assigned to the owner of its own GitHub
# credential, and the tickets it files are assigned to that owner. So several
# collaborators can each run a dispatcher against this repository without
# claiming each other's work: assign an issue to whoever should build it.
[tickets]
source = "github"
readyState = "ready"            # sole state gate, alongside the assignee gate
readyLabels = []                # no additional label gate
readyAssignee = "me"
createAssignee = "me"
createLabels = ["autobuild"]   # marks Autobuild-filed tickets (harvest proposals included),
                                # keeping them separable from user reports on public issues
createState = "ready"           # tickets filed through `ab` go straight to ready
triageState = "triage"          # bounced, aborted, and closed-unmerged tickets return here
proposalState = "triage"        # harvest proposals wait for a human to groom them to ready.
                                # Auto-dispatching them (proposalState = readyState) ran away:
                                # each proposal build's observations filed more proposals.
                                # Filter them out of the issue list with -label:autobuild:proposal.
backlogState = "icebox"         # deferred on purpose; `--role backlog` moves here
rejectedState = "rejected"      # considered and declined; `--role rejected` closes as not planned

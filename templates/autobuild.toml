# Autobuild pipeline configuration.
# Declarative only; nothing in this file is evaluated.
# Ask your coding agent to change it.

baseBranch = "main"
capacity = 1
# @ab-init/forge

# Commands the kernel may run.
[commands]
setup = "bun install"
# @ab-init/package-script-commands

# Verification gates.
[verify]
# @ab-init/package-script-verify-steps

# @ab-init/package-script-verify-tables

# Post-verification steps.
[finalize]
steps = []

# @ab-init/roles-start
# Default agent runtime.
[roles.default]
runtime = "claude"
# @ab-init/roles-end

# Pipeline limits.
[policy]
stallRounds = 3
maxVerifyAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 4
harvestThreshold = 5

# @ab-init/tickets-start
# Ticket source and dispatch gate.
[tickets]
source = "file"
readyState = "ready"
# @ab-init/tickets-end

# Autobuild pipeline configuration.
# Declarative only; nothing in this file is evaluated.
# The setup agent will replace this schema-valid skeleton with repository-specific choices.

baseBranch = "main"
capacity = 4

# Commands are derived by the setup agent from this repository's actual toolchain.
[commands]

# Verification gates are selected by the setup agent.
[verify]
steps = []

# Post-verification steps.
[finalize]
steps = []

# Schema placeholder only; init's setup launcher does not constrain final role choices.
[roles.default]
runtime = "@ab-init/runtime@"

# Pipeline limits.
[policy]
sessionBudgetSeconds = 3600
stallRounds = 3
maxVerifyAttempts = 3
maxSetupAttempts = 3
maxReconcileAttempts = 3
maxReviewRounds = 6
harvestThreshold = 5

# Valid local ticket baseline; the setup agent reviews the repository's real workflow.
[tickets]
source = "file"
readyState = "ready"

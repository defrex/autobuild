[package]
name = "proa-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[dependencies]
anyhow = "1"
base64 = "0.22"
cookie = { version = "0.18", features = ["signed", "key-expansion"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
url = "2"
aws-sdk-s3 = "1"
aws-credential-types = "1"
axum = "0.7.9"
chrono = "0.4"
dotenvy = "0.15"
jsonschema = { version = "0.33", default-features = false }
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8"
proa_core = { version = "0.3.0" }
proa_framework_axum = { version = "0.3.0" }
proa_macros = { version = "0.3.0" }
proa_stream = { version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
